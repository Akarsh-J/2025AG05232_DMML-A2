# Central configuration: every stage reads from here (no hard-coded values in code).
seed: 42
reference_date: "2025-01-01"      # "today" for the pipeline; later timestamps are invalid

paths:
  raw: data/raw
  processed: data/processed
  features: data/features
  errors: data/errors
  models: models
  reports: reports

synthetic_data:                    # documented synthetic dataset (e-commerce style)
  n_users: 2000
  n_items: 500
  n_categories: 10
  latent_dim: 8
  mean_interactions_per_user: 22
  start_date: "2023-01-01"
  end_date: "2024-12-31"
  dirty_rate: 0.03                 # share of records deliberately corrupted for validation demo

validation:
  rating_min: 1
  rating_max: 5
  min_valid_timestamp: "2015-01-01"
  age_min: 10
  age_max: 100

preparation:
  test_fraction: 0.20              # latest 20% of interactions (by time) -> test
  positive_rating_threshold: 4     # rating >= 4 counts as a "relevant" interaction

features:
  recency_half_life_days: 90
  popularity_prior_strength: 10    # Bayesian smoothing for item average rating

training:
  top_k: [5, 10]
  primary_k: 10
  mlflow_tracking_uri: "sqlite:///mlflow.db"
  mlflow_experiment: "recommendation-pipeline"
  item_knn: {n_neighbors: 50, shrinkage: 10}
  svd: {n_components: 32}
  mf_rating: {n_factors: 16, epochs: 25, lr: 0.01, reg: 0.05}
